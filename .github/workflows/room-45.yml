name: Room-45

on:
  push:
    branches:
      - main
    paths:
      - "content/escapeRoom/room_45/**"
      - ".github/workflows/room-45.yml"
  pull_request:
    branches:
      - main
    paths:
      - "content/escapeRoom/room_45/**"
      - ".github/workflows/room-45.yml"
  workflow_dispatch:

jobs:
  test:
    name: "Test Room 45"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq rsync xxd openssl netcat-openbsd wget curl bc

      - name: Run Room 45 Solution
        working-directory: content/escapeRoom/room_45
        run: bash _solution.sh
        timeout-minutes: 2

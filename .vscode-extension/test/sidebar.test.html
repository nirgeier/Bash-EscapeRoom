<!DOCTYPE html>
<!--
  Standalone test harness for sidebar.js
  Open in a browser to verify all button handlers fire correctly
  without needing VS Code.
-->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Sidebar JS Test Harness</title>
  <style>
    body { font-family: monospace; background: #0d0d1a; color: #c8d0e0; padding: 20px; }
    .pass { color: #1abc9c; } .fail { color: #e94560; }
    #log { margin-top: 20px; }
    .entry { margin: 4px 0; }
  </style>
</head>
<body>
<h2>Sidebar.js Unit Tests</h2>
<div id="log"></div>
<script>
  // Mock acquireVsCodeApi
  const messages = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (msg) => { messages.push(msg); },
    getState: () => ({}),
    setState: () => {},
  });

  function log(label, pass, detail = '') {
    const el = document.getElementById('log');
    el.innerHTML += `<div class="entry ${pass ? 'pass' : 'fail'}">${pass ? '✅' : '❌'} ${label}${detail ? ' - ' + detail : ''}</div>`;
  }

  // Inject fake DOM matching sidebar HTML
  document.body.innerHTML += `
    <div id="app" style="display:none">
      <span class="dot" id="dot"></span>
      <span id="status-text">Stopped</span>
      <span class="port-badge hidden" id="port-badge"></span>
      <button id="btn-launch" onclick="launch()">Launch</button>
      <button id="btn-stop"   onclick="stop()" disabled>Stop</button>
      <button id="btn-open"   onclick="openRoom()" disabled>Open Room</button>
      <button id="btn-prev"   onclick="prevRoom()" disabled>‹</button>
      <button id="btn-next"   onclick="nextRoom()" disabled>›</button>
      <button id="btn-docs"   onclick="openDocs()" disabled>Docs</button>
      <button id="btn-terminal" onclick="openTerminal()" disabled>Terminal</button>
      <button onclick="clearLog()">Clear</button>
      <span id="room-num">01</span>
      <span id="room-of">/ 56</span>
      <div id="log2"></div>
    </div>
  `;
  // rename inner log to avoid collision
  document.getElementById('log2').id = 'log';
</script>
<script src="../media/sidebar.js"></script>
<script>
  // Re-grab log div (sidebar.js may have used it)
  function log(label, pass, detail = '') {
    const existing = document.querySelector('#test-log') || (() => {
      const d = document.createElement('div'); d.id = 'test-log';
      document.body.insertBefore(d, document.body.firstChild.nextSibling);
      return d;
    })();
    existing.innerHTML += `<div class="${pass ? 'pass' : 'fail'}">${pass ? '✅' : '❌'} ${label}${detail ? ' - ' + detail : ''}</div>`;
    console.log((pass ? 'PASS' : 'FAIL') + ': ' + label + (detail ? ' - ' + detail : ''));
  }

  const testLog = document.createElement('div');
  testLog.id = 'test-log';
  document.querySelector('h2').after(testLog);

  // ── Tests ──────────────────────────────────────────────────────────────────

  // 1. ready message posted on load
  log('posts ready on load', messages.some(m => m.command === 'ready'));

  // 2. launch button
  messages.length = 0;
  document.getElementById('btn-launch').click();
  log('Launch button posts launch', messages.some(m => m.command === 'launch'));

  // 3. setState enables buttons when running
  messages.length = 0;
  window.dispatchEvent(new MessageEvent('message', { data: {
    command: 'setState', status: 'running', port: 3000, currentRoom: 1, maxRooms: 56, logs: []
  }}));
  log('setState running → status text = Running',
    document.getElementById('status-text').textContent === 'Running');
  log('setState running → btn-stop enabled',
    !document.getElementById('btn-stop').disabled);
  log('setState running → btn-terminal enabled',
    !document.getElementById('btn-terminal').disabled);
  log('setState running → btn-docs enabled',
    !document.getElementById('btn-docs').disabled);
  log('setState running → btn-launch disabled',
    document.getElementById('btn-launch').disabled);

  // 4. terminal button
  messages.length = 0;
  document.getElementById('btn-terminal').click();
  log('Terminal button posts openTerminal', messages.some(m => m.command === 'openTerminal'));

  // 5. docs button
  messages.length = 0;
  document.getElementById('btn-docs').click();
  log('Docs button posts openDocs', messages.some(m => m.command === 'openDocs'));

  // 6. stop button
  messages.length = 0;
  document.getElementById('btn-stop').click();
  log('Stop button posts stop', messages.some(m => m.command === 'stop'));

  // 7. setState stopped → disables buttons
  window.dispatchEvent(new MessageEvent('message', { data: {
    command: 'setState', status: 'stopped', port: 3000, currentRoom: 1, maxRooms: 56, logs: []
  }}));
  log('setState stopped → btn-terminal disabled',
    document.getElementById('btn-terminal').disabled);
  log('setState stopped → btn-launch enabled',
    !document.getElementById('btn-launch').disabled);

  // 8. appendLog
  window.dispatchEvent(new MessageEvent('message', { data: {
    command: 'appendLog', line: '✅ Server ready'
  }}));
  log('appendLog adds line to log div',
    document.getElementById('log').textContent.includes('Server ready'));
</script>
</body>
</html>

services:
  escape-room-bash:
    build:
      args:
        BUILD_TIME: ${BUILD_TIME:-}
        IMAGE: ${IMAGE:-ghcr.io/nirgeier/bash-escaperoom}
        IMAGE_TAG: ${IMAGE_TAG:-latest}
        SourceRepository: ${SourceRepository:-}
      context: ..
      dockerfile: docker/Dockerfile
      x-bake:
        platforms:
          - linux/amd64
          - linux/arm64
          - linux/arm/v6
          - linux/arm/v7
        tags:
          - ghcr.io/nirgeier/bash-escaperoom:latest
          - ghcr.io/nirgeier/bash-escaperoom:${IMAGE_TAG:-latest}
          - nirgeier/bash-escaperoom:latest
          - nirgeier/bash-escaperoom:${IMAGE_TAG:-latest}
    container_name: bash-escape-room
    image: "ghcr.io/nirgeier/bash-escaperoom:${IMAGE_TAG:-latest}"
    labels:
      - "com.example.app.Metadata.LastTagTime=${BUILD_TIME:-}"
      - "com.example.app.Metadata.SourceRepository=${SourceRepository:-}"
    restart: unless-stopped
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true
    develop:
      watch:
        # Sync static UI files without rebuild
        - action: sync
          path: ../docker/public/
          target: /app/public/
        # Sync room content without rebuild
        - action: sync
          path: ../content/escapeRoom/
          target: /app/rooms/
        # Rebuild on server or Dockerfile changes
        - action: rebuild
          path: ../docker/server.js
        - action: rebuild
          path: ../docker/Dockerfile
        - action: rebuild
          path: ../docker/entrypoint.sh
